<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز قيادة المريخ | Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(234, 88, 12, 0.15); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#050505] text-white font-sans overflow-x-hidden selection:bg-orange-600 selection:text-white flex">

    <!-- القائمة الجانبية -->
    <aside class="w-64 glass-panel h-screen fixed right-0 top-0 hidden md:flex flex-col border-l border-orange-900/30 z-50">
        <div class="h-20 flex items-center justify-center border-b border-orange-900/30">
            <span class="text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-amber-300">المريخ أدمين</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-4">
            <a href="#" class="flex items-center gap-3 bg-orange-600/20 text-orange-400 px-4 py-3 rounded-xl border border-orange-500/30">
                <span>🚀</span> <span>الطلبات (الكبسولات)</span>
            </a>
        </nav>
    </aside>

    <!-- مساحة العمل الرئيسية -->
    <main class="flex-1 md:mr-64 min-h-screen flex flex-col relative">
        <header class="h-20 bg-black/80 backdrop-blur-md sticky top-0 z-40 px-8 flex items-center justify-between border-b border-orange-900/30">
            <h1 class="text-xl font-bold text-gray-200">الطلبات الحالية</h1>
            <button onclick="fetchOrders()" class="bg-orange-600/20 text-orange-400 border border-orange-500/30 hover:bg-orange-600 hover:text-white px-4 py-2 rounded-lg text-sm font-bold transition">
                تحديث البيانات 🔄
            </button>
        </header>

        <div class="p-8 space-y-8 relative z-10">
            <!-- إحصائيات سريعة -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-panel p-6 rounded-2xl border-t-[3px] border-t-orange-500">
                    <p class="text-gray-400 text-sm mb-2">إجمالي الطلبات المستلمة</p>
                    <h3 class="text-4xl font-black text-white" id="total-orders-count">0</h3>
                </div>
            </div>

            <!-- جدول الطلبات -->
            <div class="glass-panel rounded-2xl overflow-hidden shadow-lg">
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-black/60 text-gray-400 text-sm">
                                <th class="p-4 font-medium">العميل ورقم التليفون</th>
                                <th class="p-4 font-medium">العنوان بالتفصيل</th>
                                <th class="p-4 font-medium">المنتجات المطلوبة</th>
                                <th class="p-4 font-medium">الإجمالي</th>
                                <th class="p-4 font-medium">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="text-sm">
                            <tr><td colspan="5" class="p-8 text-center text-gray-500">جاري سحب البيانات من السيرفر...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- سكربت ربط قاعدة البيانات -->
    <script>
        // 1. نفس بيانات الاتصال بتاعت صفحة الموقع بالظبط
        const SUPABASE_URL = 'https://grvthtmcqyltvtbffmhf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_eGlVgz9MIuzKEcg65vPRuw_8i6PbYQe'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. دالة سحب الطلبات من قاعدة البيانات
        async function fetchOrders() {
            const tableBody = document.getElementById('orders-table-body');
            tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">جاري التحديث... ⏳</td></tr>`;

            // قراءة البيانات من جدول orders وترتيبها من الأحدث للأقدم
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">حدث خطأ أثناء سحب البيانات!</td></tr>`;
                return;
            }

            // تحديث العداد
            document.getElementById('total-orders-count').innerText = orders.length;

            if (orders.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500 text-lg">لا توجد طلبات جديدة حالياً</td></tr>`;
                return;
            }

            // رسم الجدول بالبيانات
            tableBody.innerHTML = '';
            orders.forEach(order => {
                const row = `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition">
                        <td class="p-4">
                            <span class="text-gray-200 font-bold block">${order.customer_name}</span>
                            <span class="text-orange-400 text-xs font-mono">${order.phone}</span>
                        </td>
                        <td class="p-4 text-gray-300 max-w-xs leading-relaxed">${order.address}</td>
                        <td class="p-4 text-gray-400 text-xs max-w-xs leading-relaxed">${order.items}</td>
                        <td class="p-4 font-bold text-white">${order.total}</td>
                        <td class="p-4">
                            <button onclick="deleteOrder(${order.id})" class="text-red-400 hover:text-white bg-red-500/10 hover:bg-red-600 transition text-xs border border-red-500/30 px-3 py-2 rounded-lg">حذف الطلب</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // 3. دالة حذف الطلب بعد ما تسلمه أو ترفضه
        async function deleteOrder(orderId) {
            if(confirm("متأكد إنك عايز تمسح الطلب ده نهائياً؟")) {
                const { error } = await supabaseClient
                    .from('orders')
                    .delete()
                    .eq('id', orderId);

                if (error) {
                    alert("حصل خطأ ومش قادر يمسح الطلب.");
                } else {
                    fetchOrders(); // ريفريش للجدول بعد المسح
                }
            }
        }

        // تشغيل الدالة أول ما الصفحة تفتح
        window.onload = fetchOrders;
    </script>
</body>
</html>
